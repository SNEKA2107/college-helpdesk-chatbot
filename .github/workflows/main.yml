name: Check Excel File

on:
  workflow_dispatch:

jobs:
  check-file:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          ls -la

      - name: Check Excel file
        run: |
          test -f "selenium test.xlsx"
          echo "Excel file is available successfully!"
