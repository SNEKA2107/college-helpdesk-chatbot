name: Check 1400 Test Cases Excel

on:
  workflow_dispatch:

jobs:
  check-excel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository Files
        run: |
          pwd
          ls -lah

      - name: Verify Excel File
        run: |
          test -f "SELENIUM_NODE-JS_1400_TEST_CASES.xlsx"
          echo "✅ Excel file found."

      - name: Upload Excel File
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-1400-Test-Cases
          path: "SELENIUM_NODE-JS_1400_TEST_CASES.xlsx"
          if-no-files-found: error
