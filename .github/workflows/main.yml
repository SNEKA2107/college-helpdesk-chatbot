name: Check Excel Files

on:
  workflow_dispatch:

jobs:
  check-excel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Repository Files
        run: |
          pwd
          ls -lah

      - name: Verify Both Excel Files
        run: |
          test -f "selenium test.xlsx"
          echo "✅ selenium test.xlsx found"

          test -f "SELENIUM_NODEJS_1400_TEST_CASES.xlsx"
          echo "✅ SELENIUM_NODEJS_1400_TEST_CASES.xlsx found"

      - name: Upload Selenium Test Workbook
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-Test-Workbook
          path: "selenium test.xlsx"

      - name: Upload 1400 Test Cases Workbook
        uses: actions/upload-artifact@v4
        with:
          name: Selenium-1400-Test-Cases
          path: "SELENIUM_NODEJS_1400_TEST_CASES.xlsx"
