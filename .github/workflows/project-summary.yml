name: Project Summary

on:
  push:
    branches:
      - '**'

# Rapid pushes to the same ref only need the newest summary.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  project-summary:
    name: Generate Project Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # No checkout step: this job only reads the github context and the clock,
    # never the working tree, so cloning the repo was pure overhead.
    steps:
      - name: Generate Project Summary
        run: |
          TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # 📌 Campus HelpDesk — Project Summary

          ## Project Information
          - **Project Name:** Campus HelpDesk (College Helpdesk & Campus OS)
          - **Frontend:** React 18 + Vite, packaged for Android with Capacitor
          - **Backend:** Node.js + Express + MongoDB
          - **Hosting:** Render (single service serving the API and the built SPA)

          ## Features
          - Student Login
          - Staff/Admin Dashboard
          - Helpdesk Ticket Management
          - Chatbot Assistance

          ## Workflow Details
          - **Branch Name:** ${{ github.ref_name }}
          - **Triggered By:** ${{ github.actor }}
          - **Commit ID:** ${{ github.sha }}
          - **Workflow Run Number:** ${{ github.run_number }}
          - **Repository Name:** ${{ github.repository }}
          - **Execution Timestamp:** ${TIMESTAMP}

          ## Deployment Information
          - **Deployment URL:** https://college-helpdesk-chatbot-l4bk.onrender.com
          - **Deploys From:** pushes to \`main\` (Render auto-deploy)

          ## Continuous Integration
          - Selenium end-to-end audit suite (\`.github/workflows/selenium-audit.yml\`)
          - Backend unit and security test suite (\`npm test\` in \`backend/\`)
          EOF

          echo "✅ Project summary generated successfully."
