name: Selenium E2E Audit

# Runs the full Selenium audit suite against a freshly seeded backend.
on:
  push:
    branches: [main, demo-branch]
    paths:
      - 'selenium_model/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/selenium-audit.yml'
  pull_request:
    branches: [main]
    # Kept in sync with the push paths above by hand: GitHub Actions does not
    # support YAML anchors, so this cannot be factored out.
    paths:
      - 'selenium_model/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/selenium-audit.yml'
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run obsolete — cancel it
# rather than paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # selenium_model/config.py signs in with these fixed credentials. Without
      # them backend/utils/seedPassword.js generates a random password per role
      # and every authenticated test fails at the login step. These seed a
      # throwaway in-memory Mongo that dies with the runner — not real secrets.
      SEED_ADMIN_PASSWORD: admin@123
      SEED_STUDENT_PASSWORD: student123
      SEED_FACULTY_PASSWORD: faculty123

      # The whole suite drives the API from one IP, so the production per-IP
      # ceilings (server.js: AUTH_RATE_LIMIT=20 per 15 min, GLOBAL_RATE_LIMIT=150
      # per min) throttle the test run rather than any attacker: the run logged
      # 183 HTTP 429s and ~190 tests failed downstream of them. Raising the
      # ceilings here only changes this ephemeral runner — the defaults in
      # server.js are untouched, so production behaviour is unchanged, and
      # test_quality.py::test_rate_limiting_is_active_on_login still asserts the
      # limiter is attached by reading its RateLimit-* headers.
      AUTH_RATE_LIMIT: '100000'
      GLOBAL_RATE_LIMIT: '100000'
      PYTHONUTF8: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: selenium_model/requirements.txt

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      # npm ci (not install) — reproducible from the lockfile and skips
      # dependency resolution. --ignore-scripts keeps the backend postinstall
      # from running; the audit never needs what it produces.
      - name: Install backend dependencies
        run: npm ci --ignore-scripts --prefix backend

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend (produces frontend/dist)
        run: npm run build --prefix frontend

      - name: Install Python dependencies
        run: pip install -r selenium_model/requirements.txt

      - name: Start backend (seeded in-memory MongoDB) and wait for readiness
        run: |
          nohup node backend/dev-local.js > selenium_model/backend-server.log 2>&1 &
          echo "Waiting for http://localhost:5000 ..."
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5000/api/health >/dev/null; then
              echo "Backend is up after ${i} tries"; exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"; cat selenium_model/backend-server.log; exit 1

      - name: Phase 1-2 — Discovery & code audit
        working-directory: selenium_model
        run: |
          python discover.py
          python audit.py

      - name: Phase 3-5 — Run Selenium E2E suite
        working-directory: selenium_model
        run: python -m pytest tests

      - name: Phase 6-7 — Coverage analysis & master Excel report
        if: always()
        working-directory: selenium_model
        run: python report_generator.py

      - name: Upload audit artifacts (report, HTML, screenshots, logs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selenium-audit-report
          # execution_report.html, not html_report.html — pytest.ini writes the
          # former, so the old path silently uploaded nothing.
          path: |
            selenium_model/MASTER_TEST_AUDIT_REPORT.xlsx
            selenium_model/FINAL_AUDIT_REPORT.md
            selenium_model/execution_report.html
            selenium_model/screenshots/
            selenium_model/data/
            selenium_model/*.log
          if-no-files-found: warn
          retention-days: 30
