<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Notices | CampusAssist Admin</title>
<link rel="stylesheet" href="style.css">
<style>
.notice-form{display:grid;gap:14px;margin-bottom:28px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:600px){.form-row{grid-template-columns:1fr;}}
.notice-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:12px;position:relative;}
.notice-card.pinned{border-color:rgba(79,70,229,0.4);}
.notice-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.notice-title{font-weight:700;color:var(--dark);font-size:15px;}
.notice-meta{font-size:12px;color:var(--text-muted);margin-top:4px;}
.notice-body{font-size:13px;color:var(--text);margin-top:10px;line-height:1.6;}
.card-actions{display:flex;gap:8px;flex-shrink:0;}
.btn-edit{padding:5px 12px;background:rgba(79,70,229,0.15);color:#818cf8;border:1px solid rgba(79,70,229,0.3);border-radius:6px;cursor:pointer;font-size:12px;}
.btn-del{padding:5px 12px;background:rgba(248,113,113,0.12);color:#f87171;border:1px solid rgba(248,113,113,0.3);border-radius:6px;cursor:pointer;font-size:12px;}
.cat-badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:600;text-transform:capitalize;}
.cat-exam{background:rgba(96,165,250,0.15);color:#60a5fa;}
.cat-fee{background:rgba(234,179,8,0.15);color:#eab308;}
.cat-general{background:rgba(100,116,139,0.15);color:#94a3b8;}
.cat-event{background:rgba(167,139,250,0.15);color:#a78bfa;}
.cat-holiday{background:rgba(74,222,128,0.15);color:#4ade80;}
.pin-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:rgba(79,70,229,0.15);color:#818cf8;margin-left:6px;}
.inactive-tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:rgba(248,113,113,0.12);color:#f87171;margin-left:6px;}
</style>
<script>document.documentElement.setAttribute("data-theme",localStorage.getItem("ca_theme")||"dark")</script>
</head>
<body>
<div class="app">
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="admin-dashboard.html" class="logo-wrap">
        <div class="logo-icon">🎓</div>
        <div class="logo-text"><h2>CampusAssist</h2><span>Admin Panel</span></div>
      </a>
    </div>
    <nav class="sidebar-nav">
      <p class="nav-section-title">Admin</p>
      <a href="admin-dashboard.html" class="nav-link"><span class="nav-icon">📊</span> Admin Dashboard</a>
      <a href="admin-leaves.html" class="nav-link"><span class="nav-icon">📝</span> Manage Leaves</a>
      <a href="admin-requests.html" class="nav-link"><span class="nav-icon">📋</span> Manage Requests</a>
      <a href="admin-notices.html" class="nav-link active"><span class="nav-icon">📢</span> Manage Notices</a>
      <a href="student-search.html" class="nav-link"><span class="nav-icon">🔍</span> Student Search</a>
      <p class="nav-section-title">Student View</p>
      <a href="dashboard.html" class="nav-link"><span class="nav-icon">🏠</span> Switch to Student</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" data-user-initial>A</div>
        <div class="user-info"><h4 data-user-name>Admin</h4><span>Administrator</span></div>
      </div>
      <a href="#" class="nav-link logout" onclick="event.preventDefault();logout()"><span class="nav-icon">🚪</span> Logout</a>
    </div>
  </aside>

  <div class="main-wrapper">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menuBtn">☰</button>
        <h1 class="page-title">Manage Notices</h1>
      </div>
      <div class="topbar-right">
        <div class="topbar-profile">
          <div class="topbar-avatar" data-user-initial>A</div>
          <span class="topbar-name" data-user-name>Admin</span>
        </div>
      </div>
    </header>

    <main class="main-content">
      <!-- Create / Edit Form -->
      <div class="card reveal" style="margin-bottom:24px;">
        <h3 class="card-title" id="formTitle">📢 Post New Notice</h3>
        <div class="notice-form" style="margin-top:16px;">
          <input type="hidden" id="editId">
          <div class="form-group">
            <label class="form-label">Title *</label>
            <input type="text" id="noticeTitle" class="form-input" placeholder="Notice title…">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Category</label>
              <select id="noticeCategory" class="form-input">
                <option value="general">General</option>
                <option value="exam">Exam</option>
                <option value="fee">Fee</option>
                <option value="event">Event</option>
                <option value="holiday">Holiday</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Expires At (optional)</label>
              <input type="date" id="noticeExpiry" class="form-input">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Content *</label>
            <textarea id="noticeContent" class="form-input" rows="4" placeholder="Notice details…" style="resize:vertical;"></textarea>
          </div>
          <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--text-muted);">
              <input type="checkbox" id="noticePinned"> Pin this notice
            </label>
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--text-muted);">
              <input type="checkbox" id="noticeActive" checked> Active (visible to students)
            </label>
          </div>
          <div style="display:flex;gap:10px;">
            <button class="btn btn-primary" onclick="submitNotice()">📢 Post Notice</button>
            <button class="btn btn-secondary" id="cancelEditBtn" style="display:none;" onclick="cancelEdit()">Cancel</button>
          </div>
        </div>
      </div>

      <!-- Notices List -->
      <div class="card reveal">
        <h3 class="card-title">All Notices <span id="noticeCount" style="font-weight:400;font-size:13px;color:var(--text-muted);"></span></h3>
        <div id="noticesList" style="margin-top:16px;">
          <div style="text-align:center;color:var(--text-muted);padding:40px 0;">Loading…</div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="app.js"></script>
<script>
requireAdmin();
populateUserInfo();

async function loadNotices() {
  const res = await apiCall('/notices');
  if (!res.ok) { showToast('Failed to load notices', 'error'); return; }
  const notices = res.data.notices || [];
  document.getElementById('noticeCount').textContent = `(${notices.length})`;
  const list = document.getElementById('noticesList');
  if (!notices.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:40px 0;">No notices yet. Create one above.</div>';
    return;
  }
  list.innerHTML = notices.map(n => {
    const catClass = ['exam','fee','event','holiday'].includes(n.category) ? `cat-${n.category}` : 'cat-general';
    const date = new Date(n.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    return `<div class="notice-card ${n.pinned ? 'pinned' : ''}">
      <div class="notice-card-head">
        <div>
          <div class="notice-title">
            ${n.pinned ? '📌 ' : ''}${n.title}
            ${n.pinned ? '<span class="pin-badge">Pinned</span>' : ''}
            ${!n.isActive ? '<span class="inactive-tag">Hidden</span>' : ''}
          </div>
          <div class="notice-meta">
            <span class="cat-badge ${catClass}">${n.category}</span>
            &nbsp;·&nbsp; ${date} &nbsp;·&nbsp; by ${n.postedBy}
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-edit" onclick="editNotice(${JSON.stringify(n).replace(/"/g,'&quot;')})">✏ Edit</button>
          <button class="btn-del" onclick="deleteNotice('${n._id}')">🗑 Delete</button>
        </div>
      </div>
      <div class="notice-body">${n.content}</div>
    </div>`;
  }).join('');
}

async function submitNotice() {
  const title   = document.getElementById('noticeTitle').value.trim();
  const content = document.getElementById('noticeContent').value.trim();
  if (!title || !content) { showToast('Title and content are required', 'warning'); return; }

  const body = {
    title, content,
    category: document.getElementById('noticeCategory').value,
    pinned:   document.getElementById('noticePinned').checked,
    isActive: document.getElementById('noticeActive').checked,
    expiresAt: document.getElementById('noticeExpiry').value || undefined,
  };

  const editId = document.getElementById('editId').value;
  const res = editId
    ? await apiCall(`/notices/${editId}`, { method: 'PUT', body: JSON.stringify(body) })
    : await apiCall('/notices', { method: 'POST', body: JSON.stringify(body) });

  if (res.ok) {
    showToast(editId ? 'Notice updated' : 'Notice posted', 'success');
    cancelEdit();
    loadNotices();
  } else {
    showToast(res.error || 'Failed to save notice', 'error');
  }
}

function editNotice(n) {
  document.getElementById('editId').value = n._id;
  document.getElementById('noticeTitle').value = n.title;
  document.getElementById('noticeContent').value = n.content;
  document.getElementById('noticeCategory').value = n.category || 'general';
  document.getElementById('noticePinned').checked = !!n.pinned;
  document.getElementById('noticeActive').checked = n.isActive !== false;
  document.getElementById('noticeExpiry').value = n.expiresAt ? n.expiresAt.split('T')[0] : '';
  document.getElementById('formTitle').textContent = '✏ Edit Notice';
  document.querySelector('[onclick="submitNotice()"]').textContent = '💾 Save Changes';
  document.getElementById('cancelEditBtn').style.display = 'inline-flex';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  document.getElementById('editId').value = '';
  document.getElementById('noticeTitle').value = '';
  document.getElementById('noticeContent').value = '';
  document.getElementById('noticeCategory').value = 'general';
  document.getElementById('noticePinned').checked = false;
  document.getElementById('noticeActive').checked = true;
  document.getElementById('noticeExpiry').value = '';
  document.getElementById('formTitle').textContent = '📢 Post New Notice';
  document.querySelector('[onclick="submitNotice()"]').textContent = '📢 Post Notice';
  document.getElementById('cancelEditBtn').style.display = 'none';
}

async function deleteNotice(id) {
  if (!confirm('Delete this notice? This cannot be undone.')) return;
  const res = await apiCall(`/notices/${id}`, { method: 'DELETE' });
  if (res.ok) { showToast('Notice deleted', 'success'); loadNotices(); }
  else showToast(res.error || 'Delete failed', 'error');
}

loadNotices();
</script>
</body>
</html>
