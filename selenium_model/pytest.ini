[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    -rA
    --tb=short
    --continue-on-collection-errors
    --html=execution_report.html
    --self-contained-html
    -p no:cacheprovider
markers =
    smoke: fast build-verification checks
    auth: authentication and session behaviour
    nav: navigation and routing
    forms: form validation and submission
    crud: create/read/update/delete flows
    search: search, filter and sort
    rbac: role-based access control
    journey: end-to-end user journeys
    api: backend API validation
    security: security observations
    a11y: accessibility checks
    perf: performance observations
    ui: UI validation
    regression: regression checks
